databases:
  - name: portfolio-rationalizer-db
    databaseName: portfolio
    user: portfolio
    plan: basic-256mb

services:
  - type: web
    name: portfolio-rationalizer
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-rationalizer-db
          property: connectionString
      - key: NODE_ENV
        value: production
